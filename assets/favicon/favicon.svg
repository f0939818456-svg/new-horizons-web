<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="日暘國際教育 New Horizons">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2520"/>
      <stop offset="1" stop-color="#4E342E"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="10" fill="url(#bg)"/>
  <g transform="translate(32 38)" fill="none" stroke="#B8943F" stroke-linecap="round">
    <!-- Sun rays -->
    <g stroke-width="1.8">
      <line x1="0" y1="-12" x2="0" y2="-26"/>
      <line x1="-5" y1="-11" x2="-9" y2="-24"/>
      <line x1="5" y1="-11" x2="9" y2="-24"/>
      <line x1="-9" y1="-9" x2="-17" y2="-20"/>
      <line x1="9" y1="-9" x2="17" y2="-20"/>
      <line x1="-12" y1="-6" x2="-22" y2="-13"/>
      <line x1="12" y1="-6" x2="22" y2="-13"/>
      <line x1="-13" y1="-3" x2="-24" y2="-4"/>
      <line x1="13" y1="-3" x2="24" y2="-4"/>
    </g>
    <!-- Sun semicircle -->
    <path d="M -12 0 A 12 12 0 0 1 12 0" fill="#B8943F" stroke="#B8943F" stroke-width="1"/>
    <!-- Book pages (wavy lines) -->
    <g stroke-width="1.4" stroke-linejoin="round">
      <path d="M -20 4 Q -10 7 0 5 Q 10 7 20 4"/>
      <path d="M -22 7 Q -11 10 0 8 Q 11 10 22 7"/>
      <path d="M -24 10 Q -12 13 0 11 Q 12 13 24 10"/>
    </g>
    <!-- Book base -->
    <path d="M -26 13 L -2 14 L 0 13 L 2 14 L 26 13 L 22 16 L 0 16 L -22 16 Z" fill="#B8943F" stroke="none"/>
  </g>
</svg>
