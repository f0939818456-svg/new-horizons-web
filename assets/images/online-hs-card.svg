<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B2520"/>
      <stop offset="55%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#7D5A50"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5ECD7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(245,236,215,0.35)"/>
      <stop offset="100%" stop-color="rgba(245,236,215,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="440" fill="url(#bg)"/>
  <circle cx="120" cy="80" r="220" fill="url(#glow)"/>
  <circle cx="500" cy="380" r="180" fill="url(#glow)" opacity="0.6"/>

  <!-- Subtle dot grid -->
  <g fill="rgba(245,236,215,0.08)">
    <circle cx="60"  cy="60"  r="2"/>
    <circle cx="120" cy="60"  r="2"/>
    <circle cx="180" cy="60"  r="2"/>
    <circle cx="540" cy="60"  r="2"/>
    <circle cx="60"  cy="380" r="2"/>
    <circle cx="120" cy="380" r="2"/>
    <circle cx="540" cy="380" r="2"/>
    <circle cx="500" cy="60"  r="2"/>
  </g>

  <!-- Diploma / cap motif -->
  <g transform="translate(300, 175)">
    <!-- Mortarboard -->
    <polygon points="-90,-30 90,-30 110,-10 -110,-10" fill="#B8943F"/>
    <polygon points="-110,-10 110,-10 0,30" fill="#9e7d32"/>
    <polygon points="-110,-10 110,-10 0,30" fill="rgba(0,0,0,0.18)"/>
    <!-- Tassel -->
    <line x1="60" y1="-30" x2="80" y2="55" stroke="#F5ECD7" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="58" r="6" fill="#F5ECD7"/>
    <!-- Base hat band -->
    <rect x="-40" y="0" width="80" height="14" rx="3" fill="#3B2520" opacity="0.85"/>
  </g>

  <!-- Eyebrow label -->
  <g transform="translate(300, 250)">
    <text text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
          font-size="13" font-weight="700"
          letter-spacing="4"
          fill="#F5ECD7" opacity="0.85">
      ONLINE HIGH SCHOOL
    </text>
  </g>

  <!-- Big title -->
  <g transform="translate(300, 300)">
    <text text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif"
          font-size="44" font-weight="900"
          letter-spacing="2"
          fill="#FFFFFF">
      美國線上高中
    </text>
  </g>

  <!-- Sub label -->
  <g transform="translate(300, 345)">
    <text text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, sans-serif"
          font-size="15" font-weight="500"
          letter-spacing="1.5"
          fill="rgba(245,236,215,0.78)">
      K-12 · USHSD · AP COURSES
    </text>
  </g>

  <!-- Accreditation chips -->
  <g transform="translate(300, 390)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11">
    <g transform="translate(-160, 0)">
      <rect x="-32" y="-13" width="64" height="26" rx="13" fill="rgba(245,236,215,0.12)" stroke="rgba(245,236,215,0.35)" stroke-width="1"/>
      <text text-anchor="middle" y="4" fill="#F5ECD7" letter-spacing="0.5">Cognia</text>
    </g>
    <g transform="translate(-78, 0)">
      <rect x="-30" y="-13" width="60" height="26" rx="13" fill="rgba(245,236,215,0.12)" stroke="rgba(245,236,215,0.35)" stroke-width="1"/>
      <text text-anchor="middle" y="4" fill="#F5ECD7" letter-spacing="0.5">WASC</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-30" y="-13" width="60" height="26" rx="13" fill="rgba(245,236,215,0.12)" stroke="rgba(245,236,215,0.35)" stroke-width="1"/>
      <text text-anchor="middle" y="4" fill="#F5ECD7" letter-spacing="0.5">NCAA</text>
    </g>
    <g transform="translate(78, 0)">
      <rect x="-30" y="-13" width="60" height="26" rx="13" fill="rgba(245,236,215,0.12)" stroke="rgba(245,236,215,0.35)" stroke-width="1"/>
      <text text-anchor="middle" y="4" fill="#F5ECD7" letter-spacing="0.5">AP</text>
    </g>
    <g transform="translate(160, 0)">
      <rect x="-32" y="-13" width="64" height="26" rx="13" fill="#B8943F"/>
      <text text-anchor="middle" y="4" fill="#FFFFFF" letter-spacing="0.5">USHSD</text>
    </g>
  </g>
</svg>
