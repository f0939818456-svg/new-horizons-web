<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="UC 考慮恢復 SAT / ACT 數學能力">
  <defs>
    <linearGradient id="ubg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2520"/>
      <stop offset="1" stop-color="#4E342E"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B8943F" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#B8943F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#ubg)"/>

  <!-- California sun rays in background -->
  <g transform="translate(400 300)" opacity="0.85">
    <circle r="240" fill="url(#sunGlow)"/>
    <g stroke="#B8943F" stroke-width="2" opacity="0.35">
      <line x1="0" y1="-200" x2="0" y2="-260"/>
      <line x1="0" y1="200" x2="0" y2="260"/>
      <line x1="-200" y1="0" x2="-260" y2="0"/>
      <line x1="200" y1="0" x2="260" y2="0"/>
      <line x1="-142" y1="-142" x2="-184" y2="-184"/>
      <line x1="142" y1="-142" x2="184" y2="-184"/>
      <line x1="-142" y1="142" x2="-184" y2="184"/>
      <line x1="142" y1="142" x2="184" y2="184"/>
    </g>
  </g>

  <!-- Floating math symbols (background) -->
  <g opacity="0.18" fill="#F5ECD7" font-family="'Times New Roman', serif" font-style="italic">
    <text x="90" y="160" font-size="68" font-weight="700">∫</text>
    <text x="690" y="170" font-size="62" font-weight="700">π</text>
    <text x="80" y="490" font-size="58" font-weight="700">√</text>
    <text x="680" y="500" font-size="58" font-weight="700">Σ</text>
    <text x="180" y="100" font-size="34" font-weight="700">f(x)</text>
    <text x="600" y="430" font-size="34" font-weight="700">x²</text>
  </g>

  <!-- Central chalkboard panel -->
  <g transform="translate(240 180)">
    <rect width="320" height="200" rx="14" fill="#3B2520" stroke="#B8943F" stroke-width="2.5"/>
    <text x="160" y="48" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" fill="#B8943F" letter-spacing="6">MATH READINESS</text>
    <line x1="60" y1="64" x2="260" y2="64" stroke="#B8943F" stroke-width="1.5" opacity="0.6"/>

    <!-- Equation -->
    <text x="160" y="120" text-anchor="middle" font-family="'Times New Roman', serif" font-size="46" font-weight="700" fill="#F5ECD7" font-style="italic">∫ƒ(x)dx = ?</text>

    <!-- 1,000+ faculty stat -->
    <text x="160" y="168" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#F5ECD7" letter-spacing="1">1,000+ UC FACULTY</text>
    <text x="160" y="188" text-anchor="middle" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="11" font-weight="600" fill="#F5ECD7" opacity="0.65" letter-spacing="3">RAISED CONCERNS</text>
  </g>

  <!-- UC seal-like badge -->
  <g transform="translate(400 460)">
    <circle r="40" fill="#F5ECD7"/>
    <circle r="40" fill="none" stroke="#B8943F" stroke-width="2"/>
    <text y="-2" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="900" fill="#4E342E" letter-spacing="1">UC</text>
    <text y="18" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#7D5A50" letter-spacing="2">BOARS</text>
  </g>

  <!-- Footer text -->
  <text x="400" y="540" text-anchor="middle" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="20" font-weight="800" fill="#F5ECD7" letter-spacing="3">UC 重新討論 SAT / ACT</text>
  <text x="400" y="572" text-anchor="middle" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="13" font-weight="500" fill="#F5ECD7" opacity="0.6" letter-spacing="4">從數學準備度看美國申請新趨勢</text>
</svg>
