<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="加拿大 2026 學簽政策">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2520"/>
      <stop offset="1" stop-color="#4E342E"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8943F"/>
      <stop offset="1" stop-color="#8B6E2D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cbg)"/>

  <!-- Document / Permit shape -->
  <g transform="translate(170 100)">
    <rect width="320" height="420" rx="10" fill="#F5ECD7"/>
    <rect width="320" height="60" rx="10" fill="#B8943F"/>
    <rect y="50" width="320" height="10" fill="#B8943F"/>
    <text x="160" y="38" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#3B2520" letter-spacing="4">STUDY PERMIT</text>
    <text x="160" y="58" text-anchor="middle" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="11" font-weight="600" fill="#3B2520" opacity="0.7" letter-spacing="3">CANADA · 2026</text>

    <!-- Form lines -->
    <g fill="#7D5A50" opacity="0.35">
      <rect x="30" y="100" width="120" height="8" rx="2"/>
      <rect x="30" y="120" width="200" height="8" rx="2"/>
      <rect x="30" y="160" width="80" height="8" rx="2"/>
      <rect x="30" y="180" width="240" height="8" rx="2"/>
      <rect x="30" y="220" width="110" height="8" rx="2"/>
      <rect x="30" y="240" width="180" height="8" rx="2"/>
    </g>

    <!-- 408,000 stat -->
    <g transform="translate(160 320)">
      <text text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="900" fill="#4E342E" letter-spacing="-1">408K</text>
      <text y="32" text-anchor="middle" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="13" font-weight="700" fill="#7D5A50" letter-spacing="3">2026 STUDY PERMIT TARGET</text>
    </g>

    <!-- Stamp circle -->
    <g transform="translate(245 380)" opacity="0.85">
      <circle r="42" fill="none" stroke="#B13A2B" stroke-width="2.5"/>
      <circle r="32" fill="none" stroke="#B13A2B" stroke-width="1.5" opacity="0.7"/>
      <text text-anchor="middle" y="-4" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="800" fill="#B13A2B" letter-spacing="1">CAP</text>
      <text text-anchor="middle" y="12" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#B13A2B" letter-spacing="1">−16%</text>
    </g>
  </g>

  <!-- Maple leaf -->
  <g transform="translate(610 250) scale(1.4)" fill="url(#leafGrad)">
    <path d="M0,-60 L8,-30 L34,-44 L24,-14 L52,-10 L30,8 L46,32 L20,28 L20,46 L0,32 L-20,46 L-20,28 L-46,32 L-30,8 L-52,-10 L-24,-14 L-34,-44 L-8,-30 Z"/>
  </g>

  <!-- Footer text -->
  <text x="400" y="555" text-anchor="middle" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="20" font-weight="800" fill="#F5ECD7" letter-spacing="5">加拿大 2026 學簽政策</text>
</svg>
