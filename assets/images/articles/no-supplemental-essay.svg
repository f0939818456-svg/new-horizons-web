<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="美國大學取消 Supplemental Essay 趨勢分析">
  <defs>
    <linearGradient id="nbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2520"/>
      <stop offset="1" stop-color="#4E342E"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#nbg)"/>

  <!-- Decorative background grid lines -->
  <g opacity="0.08" stroke="#F5ECD7" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- Document stack: 3 papers, the front one with a big strike -->
  <!-- back paper -->
  <g transform="translate(260 100) rotate(-6)">
    <rect width="280" height="360" rx="6" fill="#F5ECD7" opacity="0.55"/>
  </g>
  <!-- middle paper -->
  <g transform="translate(280 110) rotate(3)">
    <rect width="280" height="360" rx="6" fill="#F5ECD7" opacity="0.8"/>
  </g>
  <!-- front paper -->
  <g transform="translate(270 130)">
    <rect width="280" height="360" rx="8" fill="#F5ECD7"/>

    <!-- Header -->
    <text x="20" y="46" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="#3B2520" letter-spacing="3">SUPPLEMENTAL ESSAY</text>
    <line x1="20" y1="58" x2="260" y2="58" stroke="#B8943F" stroke-width="2"/>

    <!-- Prompt line -->
    <text x="20" y="84" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#7D5A50">PROMPT</text>
    <text x="20" y="102" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#7D5A50">Why our university? (250 words)</text>

    <!-- Text lines representing essay body -->
    <g fill="#7D5A50">
      <rect x="20" y="120" width="240" height="4" rx="2"/>
      <rect x="20" y="134" width="220" height="4" rx="2"/>
      <rect x="20" y="148" width="240" height="4" rx="2"/>
      <rect x="20" y="162" width="200" height="4" rx="2"/>
      <rect x="20" y="176" width="232" height="4" rx="2"/>
      <rect x="20" y="190" width="180" height="4" rx="2"/>
      <rect x="20" y="204" width="240" height="4" rx="2"/>
      <rect x="20" y="218" width="216" height="4" rx="2"/>
      <rect x="20" y="232" width="236" height="4" rx="2"/>
      <rect x="20" y="246" width="200" height="4" rx="2"/>
      <rect x="20" y="260" width="224" height="4" rx="2"/>
      <rect x="20" y="274" width="160" height="4" rx="2"/>
    </g>

    <!-- Removed stamp -->
    <g transform="translate(140 320) rotate(-12)">
      <rect x="-72" y="-22" width="144" height="40" rx="4" fill="none" stroke="#B8943F" stroke-width="3"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="900" fill="#B8943F" letter-spacing="4">REMOVED</text>
    </g>

    <!-- Big diagonal strike across the document -->
    <line x1="10" y1="20" x2="270" y2="340" stroke="#B8943F" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Footer text -->
  <text x="400" y="525" text-anchor="middle" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="22" font-weight="800" fill="#F5ECD7" letter-spacing="3">美國大學取消 Supplemental Essay 趨勢</text>
  <text x="400" y="560" text-anchor="middle" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="13" font-weight="500" fill="#F5ECD7" opacity="0.65" letter-spacing="4">AI 時代下，申請真的變簡單了嗎？</text>
</svg>
