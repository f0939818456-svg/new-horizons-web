<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="2027 QS 世界大學排名">
  <defs>
    <linearGradient id="qsbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2520"/>
      <stop offset="1" stop-color="#4E342E"/>
    </linearGradient>
    <radialGradient id="qsGlobe" cx="0.3" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#7D5A50" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3B2520" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#qsbg)"/>

  <!-- Floating dots (countries) -->
  <g opacity="0.18" fill="#F5ECD7">
    <circle cx="100" cy="70" r="2"/><circle cx="180" cy="120" r="1.5"/>
    <circle cx="640" cy="80" r="2"/><circle cx="720" cy="180" r="1.5"/>
    <circle cx="80" cy="500" r="2"/><circle cx="730" cy="510" r="2"/>
    <circle cx="160" cy="540" r="1.5"/><circle cx="660" cy="50" r="1.5"/>
  </g>

  <!-- Half-circle globe (left side) -->
  <g transform="translate(220 310)">
    <circle r="170" fill="url(#qsGlobe)" stroke="#B8943F" stroke-width="2.5"/>
    <ellipse rx="170" ry="56" fill="none" stroke="#B8943F" stroke-width="1.4" opacity="0.65"/>
    <ellipse rx="170" ry="115" fill="none" stroke="#B8943F" stroke-width="1.1" opacity="0.5"/>
    <ellipse rx="55" ry="170" fill="none" stroke="#B8943F" stroke-width="1.4" opacity="0.65"/>
    <ellipse rx="115" ry="170" fill="none" stroke="#B8943F" stroke-width="1.1" opacity="0.5"/>
    <line x1="-170" y1="0" x2="170" y2="0" stroke="#B8943F" stroke-width="2" opacity="0.85"/>
    <line x1="0" y1="-170" x2="0" y2="170" stroke="#B8943F" stroke-width="2" opacity="0.85"/>
    <!-- City markers -->
    <g fill="#F5ECD7">
      <circle cx="-70" cy="-50" r="5"/><circle cx="40" cy="-90" r="5"/>
      <circle cx="100" cy="-25" r="5"/><circle cx="-30" cy="30" r="5"/>
      <circle cx="75" cy="80" r="5"/><circle cx="-100" cy="60" r="5"/>
    </g>
  </g>

  <!-- QS Logo badge (top-right) -->
  <g transform="translate(580 140)">
    <rect x="-72" y="-38" width="144" height="76" rx="10" fill="#B8943F"/>
    <text x="0" y="2" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="#3B2520" letter-spacing="2">QS</text>
    <text x="0" y="26" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#3B2520" letter-spacing="3">2027</text>
  </g>

  <!-- Stat badges (right side) -->
  <g transform="translate(580 280)">
    <!-- Stat 1: Top 10 -->
    <g>
      <rect x="-100" y="-30" width="200" height="56" rx="10" fill="rgba(245,236,215,0.08)" stroke="#B8943F" stroke-width="1.2"/>
      <text x="0" y="-2" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="900" fill="#F5ECD7" letter-spacing="0.5">MIT · #1</text>
      <text x="0" y="18" text-anchor="middle" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="11" font-weight="600" fill="#F5ECD7" opacity="0.65" letter-spacing="3">蟬聯全球第一</text>
    </g>
    <!-- Stat 2: NUS -->
    <g transform="translate(0 86)">
      <rect x="-100" y="-30" width="200" height="56" rx="10" fill="rgba(245,236,215,0.08)" stroke="#B8943F" stroke-width="1.2"/>
      <text x="0" y="-2" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="900" fill="#F5ECD7" letter-spacing="0.5">NUS · #10</text>
      <text x="0" y="18" text-anchor="middle" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="11" font-weight="600" fill="#F5ECD7" opacity="0.65" letter-spacing="3">亞洲進入前 10</text>
    </g>
    <!-- Stat 3: Top 300 -->
    <g transform="translate(0 172)">
      <rect x="-100" y="-30" width="200" height="56" rx="10" fill="rgba(245,236,215,0.08)" stroke="#B8943F" stroke-width="1.2"/>
      <text x="0" y="-2" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="900" fill="#F5ECD7" letter-spacing="0.5">300 所</text>
      <text x="0" y="18" text-anchor="middle" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="11" font-weight="600" fill="#F5ECD7" opacity="0.65" letter-spacing="3">完整搜尋榜單</text>
    </g>
  </g>

  <!-- Footer text -->
  <text x="400" y="555" text-anchor="middle" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="22" font-weight="800" fill="#F5ECD7" letter-spacing="3">2027 QS 世界大學排名</text>
</svg>
