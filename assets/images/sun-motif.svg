<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!--
    日暘太陽紋 · 80×80 tile
    用於品牌 banner 的背景重複圖樣，整體保留低不透明度，
    以白色（#F5ECD7）填色，覆蓋在棕色品牌底色上呈現微妙光暈。
  -->
  <g transform="translate(40,40)" fill="#F5ECD7">
    <!-- 8 道短光線（rays）以 45° 等距排列 -->
    <g fill-opacity="0.18">
      <polygon points="0,-9 1,-19 -1,-19"/>
      <g transform="rotate(45)"><polygon points="0,-9 1,-17 -1,-17"/></g>
      <g transform="rotate(90)"><polygon points="0,-9 1,-19 -1,-19"/></g>
      <g transform="rotate(135)"><polygon points="0,-9 1,-17 -1,-17"/></g>
      <g transform="rotate(180)"><polygon points="0,-9 1,-19 -1,-19"/></g>
      <g transform="rotate(225)"><polygon points="0,-9 1,-17 -1,-17"/></g>
      <g transform="rotate(270)"><polygon points="0,-9 1,-19 -1,-19"/></g>
      <g transform="rotate(315)"><polygon points="0,-9 1,-17 -1,-17"/></g>
    </g>

    <!-- 中心圓環 -->
    <circle r="6" fill="none" stroke="#F5ECD7" stroke-opacity="0.28" stroke-width="0.9"/>
    <!-- 中心實心點 -->
    <circle r="2.4" fill-opacity="0.42"/>
  </g>
</svg>
