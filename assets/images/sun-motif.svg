<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#F5ECD7" stop-opacity="0.18"/>
      <stop offset="55%"  stop-color="#F5ECD7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#F5ECD7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft halo -->
  <circle cx="100" cy="100" r="100" fill="url(#sunHalo)"/>

  <!-- Outer rays: long thin slivers radiating from center -->
  <g fill="#F5ECD7" fill-opacity="0.18">
    <!-- 16 rays at 22.5° intervals -->
    <g transform="translate(100,100)">
      <!-- ray polygon: thin tapered sliver pointing up -->
      <g><polygon points="0,-30 1.6,-90 -1.6,-90"/></g>
      <g transform="rotate(22.5)"><polygon points="0,-30 1.4,-78 -1.4,-78"/></g>
      <g transform="rotate(45)"><polygon points="0,-30 1.6,-90 -1.6,-90"/></g>
      <g transform="rotate(67.5)"><polygon points="0,-30 1.4,-78 -1.4,-78"/></g>
      <g transform="rotate(90)"><polygon points="0,-30 1.6,-90 -1.6,-90"/></g>
      <g transform="rotate(112.5)"><polygon points="0,-30 1.4,-78 -1.4,-78"/></g>
      <g transform="rotate(135)"><polygon points="0,-30 1.6,-90 -1.6,-90"/></g>
      <g transform="rotate(157.5)"><polygon points="0,-30 1.4,-78 -1.4,-78"/></g>
      <g transform="rotate(180)"><polygon points="0,-30 1.6,-90 -1.6,-90"/></g>
      <g transform="rotate(202.5)"><polygon points="0,-30 1.4,-78 -1.4,-78"/></g>
      <g transform="rotate(225)"><polygon points="0,-30 1.6,-90 -1.6,-90"/></g>
      <g transform="rotate(247.5)"><polygon points="0,-30 1.4,-78 -1.4,-78"/></g>
      <g transform="rotate(270)"><polygon points="0,-30 1.6,-90 -1.6,-90"/></g>
      <g transform="rotate(292.5)"><polygon points="0,-30 1.4,-78 -1.4,-78"/></g>
      <g transform="rotate(315)"><polygon points="0,-30 1.6,-90 -1.6,-90"/></g>
      <g transform="rotate(337.5)"><polygon points="0,-30 1.4,-78 -1.4,-78"/></g>
    </g>
  </g>

  <!-- Inner ring -->
  <circle cx="100" cy="100" r="22" fill="none" stroke="#F5ECD7" stroke-opacity="0.32" stroke-width="1.2"/>
  <!-- Solid core -->
  <circle cx="100" cy="100" r="11" fill="#F5ECD7" fill-opacity="0.42"/>
</svg>
